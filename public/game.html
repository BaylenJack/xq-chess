<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2528">
  <title>棋局 · 青黛棋院</title>
  <link rel="stylesheet" href="/css/app.css?v=4">
</head>
<body class="game-page">
  <div class="atmosphere" aria-hidden="true"><span class="grain"></span><span class="orbit orbit-a"></span></div>

  <header class="game-header">
    <a class="wordmark compact" href="/" aria-label="返回棋院大厅">
      <span class="wordmark-seal">弈</span>
      <span><strong>青黛棋院</strong><small>返回大厅</small></span>
    </a>
    <button id="roomBadge" class="room-chip" type="button" title="复制邀请链接">
      <span>房间</span><b id="roomName">载入中</b>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
    </button>
  </header>

  <main class="game-shell">
    <section class="arena" aria-label="对局棋盘">
      <header class="player-strip">
        <article class="player-card red-side" data-side="1">
          <span class="piece-avatar red"><b>帥</b><i class="online-dot" data-for="p1"></i></span>
          <span class="player-meta"><small>红方 · 先行</small><strong class="name" id="p1-name">等待入席</strong></span>
          <span class="turn-mark">行棋</span>
        </article>
        <div class="versus" aria-hidden="true"><span>对</span></div>
        <article class="player-card black-side" data-side="-1">
          <span class="player-meta align-right"><small>黑方 · 后行</small><strong class="name" id="p2-name">等待入席</strong></span>
          <span class="piece-avatar black"><b>將</b><i class="online-dot" data-for="p2"></i></span>
          <span class="turn-mark">行棋</span>
        </article>
      </header>

      <section class="board-frame">
        <div class="frame-caption top" aria-hidden="true"><span>九路十行</span><i></i><span>楚汉争锋</span></div>
        <div id="board" class="board" aria-label="中国象棋棋盘"></div>
        <div id="waitOverlay" class="wait-overlay hidden">
          <div class="wait-seal">候</div>
          <h2>虚位以待</h2>
          <p id="waitRoom">等待另一位棋友</p>
          <button id="waitCopyBtn" class="primary-button" type="button">复制邀请链接</button>
          <small>朋友打开链接后会自动填好房间名</small>
        </div>
      </section>
    </section>

    <aside class="match-desk" aria-label="棋局信息与操作">
      <section class="turn-panel">
        <p class="desk-label">CURRENT TURN</p>
        <div id="status" class="turn-status" role="status" aria-live="polite">正在进入房间</div>
        <div id="timerDisplay" class="clock-display hidden" aria-label="本回合剩余时间">
          <span id="clock-main">60</span><small>秒</small>
        </div>
      </section>

      <section id="recordPanel" class="record-panel">
        <button id="recordHead" class="record-head" type="button" aria-expanded="true" aria-controls="recordBody">
          <span><small>MOVE RECORD</small><b>棋谱</b></span>
          <span id="recordLast" class="record-last">暂无着法</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </button>
        <div id="recordBody" class="record-body"><p class="record-empty">落下第一子后，棋谱会记录在这里。</p></div>
      </section>

      <section class="control-panel">
        <p class="desk-label">MATCH TOOLS</p>
        <div class="control-grid">
          <button id="timerBtn" class="tool-button" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span>步时</span>
          </button>
          <button id="thinkBtn" class="tool-button hidden" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h6M10 17h4M8 14c-1.3-1-2-2.6-2-4.3a6 6 0 1 1 12 0c0 1.7-.7 3.3-2 4.3-.8.7-1 1.2-1 2H9c0-.8-.2-1.3-1-2Z"/></svg><span class="think-label">AI 提示</span>
          </button>
          <button id="autoBtn" class="tool-button hidden" type="button" aria-pressed="false" title="AI 自动下棋：算完后直接落子">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-8-8"/><path d="M20 4v5h-5"/></svg><span class="auto-label">AI 自动</span>
          </button>
          <button id="undoBtn" class="tool-button" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H5v-4M5 7a8 8 0 1 1-1 8"/></svg><span>悔棋</span>
          </button>
          <button id="restartBtn" class="tool-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M6.1 9a7 7 0 0 1 11.8-2.6L20 9M4 15l2.1 2.6A7 7 0 0 0 17.9 15"/></svg><span>重开</span>
          </button>
        </div>
      </section>

      <p class="desk-foot">棋局由服务器裁定 · 断线后席位保留 60 秒</p>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="confirmModal" class="dialog-layer" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
    <div class="dialog-card">
      <span class="dialog-seal">问</span>
      <h2 id="confirmTitle"></h2>
      <p id="confirmSub"></p>
      <div id="confirmRing" class="confirm-ring hidden"><span id="ringNum">30</span><svg viewBox="0 0 44 44"><circle class="ring-track" cx="22" cy="22" r="18"/><circle id="ringFg" class="ring-value" cx="22" cy="22" r="18"/></svg></div>
      <div id="confirmActions" class="dialog-actions"><button id="confirmCancel" type="button">取消</button><button id="confirmOk" class="primary" type="button">确定</button></div>
    </div>
  </div>

  <div id="resultModal" class="dialog-layer" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
    <div class="dialog-card result-card">
      <span class="dialog-seal">局</span>
      <p id="resultReason" class="result-reason"></p>
      <h2 id="resultTitle"></h2>
      <p id="resultSub"></p>
      <div class="dialog-actions"><button id="resultHome" type="button">返回大厅</button><button id="resultRestart" class="primary" type="button">再来一局</button></div>
    </div>
  </div>

  <script src="/js/rules.js?v=3"></script>
  <script src="/js/notation.js?v=2"></script>
  <script src="/js/clock.js?v=2"></script>
  <script src="/js/game-page.js?v=4"></script>
</body>
</html>
