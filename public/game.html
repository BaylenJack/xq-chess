<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>对弈 · 中国象棋</title>
  <link rel="stylesheet" href="/css/style.css?v=41">
</head>
<body class="game-body">

  <div class="bg-aurora" aria-hidden="true">
    <span class="blob a"></span>
    <span class="blob b"></span>
  </div>

  <header class="game-top">
    <div class="player-card" data-side="1">
      <div class="player-frame">
        <div class="avatar red"><span class="avatar-mark">帥</span><span class="online-dot" data-for="p1"></span></div>
        <div class="player-meta">
          <span class="role">执红</span>
          <span class="name" id="p1-name">红方</span>
        </div>
      </div>
    </div>

    <div class="vs-block"><span class="vs-char">VS</span></div>

    <div class="player-card" data-side="-1">
      <div class="player-frame">
        <div class="avatar black"><span class="avatar-mark">將</span><span class="online-dot" data-for="p2"></span></div>
        <div class="player-meta">
          <span class="role">执黑</span>
          <span class="name" id="p2-name">黑方</span>
        </div>
      </div>
    </div>
  </header>

  <section class="board-stage">
    <div class="board-corner tl" aria-hidden="true"></div>
    <div class="board-corner tr" aria-hidden="true"></div>
    <div class="board-corner bl" aria-hidden="true"></div>
    <div class="board-corner br" aria-hidden="true"></div>

    <div id="board" class="board-wrap" aria-label="棋盘"></div>

    <div id="status" class="status-pill">进入房间中…</div>
  </section>

  <footer class="game-controls">
    <div class="think-row">
      <button id="thinkBtn" class="ctrl-btn think-btn" aria-label="单击开启/关闭深度思考">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21h6"/><path d="M12 17v4"/><path d="M5 8a7 7 0 0 1 14 0c0 3-3 4-3 8H8c0-4-3-5-3-8z"/>
        </svg>
        <span class="think-label">深度思考</span>
      </button>
    </div>
    <div class="control-row">
      <button id="timerBtn" class="timer-btn" aria-label="切换倒计时">⏱</button>
      <div id="timerDisplay" class="timer-inline hidden">
        <span class="timer-num" id="clock-main">60</span><span class="timer-unit">s</span>
      </div>
      <button id="undoBtn" class="ctrl-btn">悔棋</button>
      <button id="restartBtn" class="ctrl-btn">重新开始</button>
    </div>
    <div id="undoRequestModal" class="modal hidden"><div class="modal-card">等待对方确认悔棋…</div></div>
  </footer>

  <div id="modal" class="modal"><div class="modal-card"></div></div>

  <script src="/js/rules.js?v=37"></script>
  <script src="/js/ai.js?v=37"></script>
  <script src="/js/game.js?v=37"></script>
  <script src="/js/ui.js?v=37"></script>
  <script src="/js/timer.js?v=37"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => XQ.ui.init());
  </script>
</body>
</html>
