<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2528">
  <meta name="description" content="青黛棋院：打开同一房间，与朋友实时下一局中国象棋。">
  <title>青黛棋院 · 中国象棋</title>
  <link rel="stylesheet" href="/css/app.css?v=5">
</head>
<body class="lobby-page">
  <div class="atmosphere" aria-hidden="true">
    <span class="grain"></span>
    <span class="orbit orbit-a"></span>
    <span class="orbit orbit-b"></span>
  </div>

  <header class="site-header">
    <a class="wordmark" href="/" aria-label="青黛棋院首页">
      <span class="wordmark-seal">弈</span>
      <span><strong>青黛棋院</strong><small>QINGDAI XIANGQI</small></span>
    </a>
    <span id="engineStatus" class="live-note"><i></i>双人实时对弈</span>
  </header>

  <main class="lobby-shell">
    <section class="lobby-hero" aria-labelledby="heroTitle">
      <p class="eyebrow">一方棋盘 · 两位故友</p>
      <h1 id="heroTitle">隔屏相逢，<br><em>执子见高下。</em></h1>
      <p class="hero-copy">不注册，不排队。约好一个房间名，红方先行，棋局便从第一声落子开始。</p>

      <div class="river-axis" aria-hidden="true">
        <span>楚河</span><b></b><span>汉界</span>
      </div>

      <dl class="feature-list">
        <div><dt>01</dt><dd><strong>同名入室</strong><span>输入相同房间名</span></dd></div>
        <div><dt>02</dt><dd><strong>实时同步</strong><span>走子、棋谱与计时一致</span></dd></div>
        <div><dt>03</dt><dd><strong>断线续局</strong><span>短暂离开仍保留席位</span></dd></div>
      </dl>
    </section>

    <section class="join-panel" aria-labelledby="joinTitle">
      <div class="panel-index">入局帖</div>
      <div class="panel-heading">
        <p>INVITATION</p>
        <h2 id="joinTitle">落座开局</h2>
        <span>先入者执红，后入者执黑</span>
      </div>

      <form id="joinForm" novalidate>
        <label class="input-group" for="nickname">
          <span class="input-order">壹</span>
          <span class="input-copy"><b>你的称呼</b><small>对手将在棋盘上看到</small></span>
          <input id="nickname" name="nickname" type="text" maxlength="12" autocomplete="nickname" placeholder="例如：王小帅">
        </label>

        <label class="input-group" for="roomname">
          <span class="input-order">贰</span>
          <span class="input-copy"><b>房间名</b><small>与朋友输入完全相同的名字</small></span>
          <input id="roomname" name="roomname" type="text" maxlength="24" autocomplete="off" placeholder="例如：今晚八点" required autofocus>
        </label>

        <p id="formError" class="form-error" role="alert" aria-live="polite"></p>
        <button class="join-button" type="submit">
          <span>进入棋局</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <p class="privacy-note"><span>私</span> 房间名只用于本次配对，不建立账号。</p>
    </section>
  </main>

  <footer class="site-footer"><span>楚河为界</span><i></i><span>落子有声</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/lobby.js?v=3" defer></script>
</body>
</html>
